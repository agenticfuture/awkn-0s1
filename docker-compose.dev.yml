services:
  postgres:
    image: postgres:15
    container_name: awkn-postgres-dev
    environment:
      POSTGRES_DB: awkn
      POSTGRES_USER: awkn
      POSTGRES_PASSWORD: awkn
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U awkn -d awkn" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    image: node:20-alpine
    container_name: awkn-web-dev
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      CI: "1"
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: 3000
      HOSTNAME: 0.0.0.0
      POSTGRES_URL: postgresql://awkn:awkn@postgres:5432/awkn
      AUTH_SECRET: ${AUTH_SECRET:-replace-me}
      NEXTAUTH_URL: http://localhost:3005
      SERVICE_GEN_BASE_API: ${SERVICE_GEN_BASE_API:-http://host.docker.internal:8000}
      NEXT_PUBLIC_SERVICE_GEN_BASE_API: ${NEXT_PUBLIC_SERVICE_GEN_BASE_API:-http://localhost:8000}
      NEXT_PUBLIC_SERVICE_GEN_BOT_BASE_URL: ${NEXT_PUBLIC_SERVICE_GEN_BOT_BASE_URL:-http://localhost:3005}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3005:3000"
    volumes:
      - ./output_as/apps/web/awkn:/app
      # - web_node_modules:/workspace/output_as/apps/awkn/node_modules
      # - web_next:/workspace/output_as/apps/awkn/.next
    command: >
      sh -c "npm install -g pnpm && pnpm install --config.confirmModulesPurge=false && pnpm dev --hostname 0.0.0.0 --port 3000"

  wordpress_db:
    image: mariadb:10.11
    container_name: awkn-wordpress-db-dev
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example_password
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: wp_password
    volumes:
      - wordpress_db_data:/var/lib/mysql

  wordpress:
    image: wordpress:latest
    container_name: awkn-wordpress-dev
    depends_on:
      - wordpress_db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: wordpress_db:3306
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_password
      WORDPRESS_DB_NAME: wordpress
      AWKN_WP_SYNC_SECRET: ${AWKN_WP_SYNC_SECRET:-awkn-local-sync-secret}
      AWKN_YOUTUBE_CHANNEL_ID_EN: ${AWKN_YOUTUBE_CHANNEL_ID_EN:-}
      AWKN_YOUTUBE_CHANNEL_ID_FR: ${AWKN_YOUTUBE_CHANNEL_ID_FR:-}
      AWKN_YOUTUBE_FEED_LIMIT: ${AWKN_YOUTUBE_FEED_LIMIT:-6}
    volumes:
      - ./vendors/wordpress/wp-content:/var/www/html/wp-content
      - ./vendors/wordpress/setup-headless.sh:/usr/local/bin/setup-headless.sh

volumes:
  postgres_data:
  wordpress_db_data:
  web_node_modules:
  web_next:
