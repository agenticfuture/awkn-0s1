services:
  postgres:
    image: postgres:15
    container_name: awkn-postgres-dev
    environment:
      POSTGRES_DB: awkn
      POSTGRES_USER: awkn
      POSTGRES_PASSWORD: awkn
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U awkn -d awkn" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    image: node:20-alpine
    container_name: awkn-web-dev
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: 3000
      HOSTNAME: 0.0.0.0
      POSTGRES_URL: postgresql://awkn:awkn@postgres:5432/awkn
      AUTH_SECRET: ${AUTH_SECRET:-replace-me}
      NEXTAUTH_URL: http://localhost:3000
      SERVICE_GEN_BASE_API: ${SERVICE_GEN_BASE_API:-http://host.docker.internal:8000}
      NEXT_PUBLIC_SERVICE_GEN_BASE_API: ${NEXT_PUBLIC_SERVICE_GEN_BASE_API:-http://localhost:8000}
      NEXT_PUBLIC_SERVICE_GEN_BOT_BASE_URL: ${NEXT_PUBLIC_SERVICE_GEN_BOT_BASE_URL:-http://localhost:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3005:3000"
    volumes:
      - .:/app
      #- web_node_modules:/app/node_modules
      #- web_next:/app/.next
    command: >
      sh -c "npm install -g pnpm && pnpm install && pnpm db:migrate && pnpm dev " 
    #" npm i -g vercel && vercel link && vercel env pull && npm install && npm run dev "
    # bash -lc " corepack enable && pnpm install && pnpm db:migrate && pnpm dev --hostname 0.0.0.0 --port 3000 "
    # command: sh -c "npm install -g pnpm && pnpm install && pnpm db:migrate && pnpm dev " #" npm i -g vercel && vercel link && vercel env pull && npm install && npm run dev "
    # Intentionally omitted as unnecessary for this repo:
    # - qdrant
    # - minio
    # - ollama
    # - traefik
    # - grafana / prometheus
    # - keycloak
    # - sibling UI apps and control-plane services
    #
    # Those services appeared to come from a larger monorepo template, but
    # this workspace only needs Next.js + Postgres to boot locally. The
    # ServiceGen API remains an external dependency via SERVICE_GEN_BASE_API.

volumes:
  postgres_data:
  web_node_modules:
  web_next:
